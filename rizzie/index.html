<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1d4d3a">
    <title>Rizzie</title>
    <!-- Display faces for the Christmas and Disco themes' verdicts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Mountains+of+Christmas:wght@700&display=swap">
    <style>
        :root {
            --bg: #f8f4ec;
            --card: #ffffff;
            --field: #ffffff;
            --accent-text: #1d4d3a;
            --ink: #1f2a24;
            --muted: #6b6f69;
            --line: #e6dfd3;
            --green: #1d6b4a;
            --green-dark: #1d4d3a;
            --red: #b3261e;
            --gold: #c9962b;
            --radius: 0.9rem;
            /* Tier colours, shallow → deep */
            --t1: #9fb8a8;
            --t2: #5f9c7b;
            --t3: #2f7f64;
            --t4: #1f5e7a;
            --t5: #3b3f8f;
            --t6: #b07a12;
        }

        body[data-theme="christmas"] {
            --bg: #0c1828;
            --card: #14243b;
            --field: #0f1e33;
            --ink: #f2f5f9;
            --muted: #a3b3c9;
            --line: #29405f;
            --green: #c8323a;        /* buttons: Christmas red */
            --green-dark: #1f6b45;   /* active tabs and chips: holly green */
            --accent-text: #ffd36b;  /* scores and links: gold */
            --red: #ff8f8f;
            --gold: #ffd36b;
            --t1: #6f8a7c; --t2: #6f8299; --t3: #c0392b; --t4: #2e8b57; --t5: #b0577a; --t6: #b8860b;
            background: radial-gradient(120% 45% at 50% 0%, #1b3354 0%, var(--bg) 65%) fixed var(--bg);
        }
        body[data-theme="disco"] {
            --bg: #110a1c;
            --card: #1c1230;
            --field: #160d26;
            --ink: #f7f0fd;
            --muted: #ab9ec2;
            --line: #33244f;
            --green: #c2338a;        /* buttons: hot pink */
            --green-dark: #6a3fd0;   /* active tabs and chips: violet */
            --accent-text: #3ce7ff;  /* scores and links: neon cyan */
            --red: #ff7a9c;
            --gold: #ffd36b;
            --t1: #6d5a8f; --t2: #7b4fe0; --t3: #1a8fa8; --t4: #1f9e6a; --t5: #d0368f; --t6: #b8860b;
            background: radial-gradient(120% 45% at 50% 0%, #2a1446 0%, var(--bg) 65%) fixed var(--bg);
        }
        body[data-theme] { color-scheme: dark; }
        body[data-theme="christmas"] h1:not(.logo) { font-family: 'Mountains of Christmas', Georgia, serif; color: var(--gold); font-size: 2.4rem; }
        body[data-theme="disco"] h1:not(.logo) {
            font-family: 'Monoton', 'Arial Black', sans-serif; font-weight: 400; font-size: 1.9rem; line-height: 1.2;
            color: #ff4fb8; text-shadow: 0 0 14px rgba(255, 79, 184, 0.45);
        }
        /* Snow or sparkles drift behind the page; cards stay solid on top. */
        .ambient { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        #app { position: relative; z-index: 1; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.45;
        }

        #app { min-height: 100vh; padding: 1rem; }

        .container { max-width: 34rem; margin: 0 auto; }

        .loading {
            display: flex; align-items: center; justify-content: center;
            min-height: 60vh; color: var(--muted); font-size: 1.1rem;
        }

        header { text-align: center; margin: 0.75rem 0 1.25rem; }
        h1 { font-size: 1.9rem; line-height: 1.15; }
        h1.logo { font-size: 2.8rem; color: var(--accent-text); letter-spacing: -0.02em; }
        h2 { font-size: 1.15rem; margin: 1.5rem 0 0.6rem; }
        .subtitle { color: var(--muted); margin-top: 0.25rem; }
        .hint { color: var(--muted); font-size: 0.875rem; margin-top: 0.6rem; }
        .error { color: var(--red); font-size: 0.9rem; min-height: 1.2em; margin-top: 0.5rem; }
        .error:empty { min-height: 0; margin: 0; }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.6rem 0; }

        .btn {
            display: block; width: 100%;
            font: inherit; font-weight: 650; font-size: 1rem;
            padding: 0.8rem 1rem; margin-top: 0.6rem;
            border-radius: 0.7rem; border: 2px solid transparent;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn-primary { background: var(--green); color: #fff; }
        .btn-secondary { background: var(--card); color: var(--ink); border-color: var(--line); }
        .btn-big { font-size: 1.15rem; padding: 1rem; }
        .btn-small { width: auto; display: inline-block; font-size: 0.875rem; padding: 0.45rem 0.8rem; margin-top: 0; }
        .link { background: none; border: none; font: inherit; color: var(--accent-text); text-decoration: underline; cursor: pointer; }

        label { display: block; font-weight: 600; margin: 0.8rem 0 0.3rem; }
        /* 16px+ stops iPhones zooming in when an input is focused */
        input, textarea {
            width: 100%; font: inherit; font-size: 1rem;
            padding: 0.7rem 0.8rem;
            border: 2px solid var(--line); border-radius: 0.6rem;
            background: var(--field); color: var(--ink);
        }
        input:focus, textarea:focus { outline: none; border-color: var(--green); }
        textarea { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }

        .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; }
        .tab {
            flex: 1; font: inherit; font-weight: 600; padding: 0.55rem;
            border: 2px solid var(--line); border-radius: 0.6rem; background: var(--bg); cursor: pointer;
        }
        .tab.active { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }

        .footer { text-align: center; color: var(--muted); font-size: 0.875rem; margin: 2rem 0 1rem; }

        /* Home */
        .game-card { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
        .game-title { font-weight: 700; font-size: 1.05rem; }
        .game-meta { color: var(--muted); font-size: 0.85rem; }
        .game-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        .score-pill { font-weight: 700; color: var(--accent-text); white-space: nowrap; }

        .tier-legend { list-style: none; margin: 0.8rem 0 0.2rem; }
        .tier-legend li { display: flex; justify-content: space-between; padding: 0.25rem 0; border-bottom: 1px dashed var(--line); }

        /* Playing — everything sits at the top, since the keyboard covers the bottom half */
        .play-top { display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; font-size: 0.9rem; }
        .timer { height: 0.6rem; background: var(--line); border-radius: 1rem; overflow: hidden; margin-top: 0.6rem; }
        .timer-fill { height: 100%; width: 100%; background: var(--green); transition: width 0.1s linear; }
        .timer-fill.urgent { background: var(--red); }
        .timer-secs { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
        .prompt-text { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 0.5rem 0 1rem; }
        .prompt-text-small { font-size: 1.1rem; margin: 0.4rem 0 0.6rem; }
        .answer-form { display: flex; gap: 0.5rem; }
        .answer-form input { font-size: 1.1rem; }
        .answer-form .btn { width: auto; margin-top: 0; padding: 0 1.2rem; }

        .nope { color: var(--red); font-weight: 600; margin-top: 0.7rem; min-height: 1.4em; }
        .nope.shake { animation: shake 0.35s; }
        @keyframes shake {
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .verdict { text-align: center; }
        .verdict-tier { font-size: 1.5rem; font-weight: 800; }
        .verdict-detail { color: var(--muted); margin-top: 0.2rem; }
        .plus { color: var(--accent-text); }

        /* Descent placeholder — see js/descent.js */
        .descent { display: flex; flex-direction: column; gap: 0.3rem; margin: 0.5rem 0 0.25rem; }
        .descent-step {
            display: flex; justify-content: space-between;
            padding: 0.45rem 0.8rem; border-radius: 0.5rem;
            background: var(--card); border: 1px solid var(--line); color: var(--muted);
            font-size: 0.9rem; transition: background 0.25s, color 0.25s, transform 0.25s;
        }
        .descent-step.reached { color: #fff; border-color: transparent; }
        .descent-step.reached[data-tier="1"] { background: var(--t1); }
        .descent-step.reached[data-tier="2"] { background: var(--t2); }
        .descent-step.reached[data-tier="3"] { background: var(--t3); }
        .descent-step.reached[data-tier="4"] { background: var(--t4); }
        .descent-step.reached[data-tier="5"] { background: var(--t5); }
        .descent-step.reached[data-tier="6"] { background: var(--t6); }
        .descent-step.landed { transform: scale(1.04); font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }

        /* Themed scenes — see js/themes/. A dark window onto the scene,
           sized to fit above the Next button on a phone. */
        .theme-stage {
            position: relative; overflow: hidden; border-radius: var(--radius);
            height: clamp(300px, 50vh, 430px); margin: 0.5rem 0 0.25rem;
        }
        .stage-christmas { background: radial-gradient(120% 70% at 50% 0%, #1b3354 0%, #07101b 70%); }
        .stage-disco { background: radial-gradient(120% 70% at 50% 0%, #2a1446 0%, #0b0614 70%); }
        .theme-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        /* Themed verdicts sit on the scene's own dark colours so every tier colour reads */
        .verdict-christmas { background: #12223a; border-color: #24395a; color: #f4f7fb; }
        .verdict-disco { background: #1c1230; border-color: #33244f; color: #f7f0fd; }
        .verdict-christmas .verdict-detail { color: #a3b3c9; }
        .verdict-disco .verdict-detail { color: #ab9ec2; }
        .verdict-christmas .plus, .verdict-disco .plus { color: #ffffff; }
        .verdict-christmas .verdict-tier { font-family: 'Mountains of Christmas', Georgia, serif; font-size: 2rem; line-height: 1.05; }
        .verdict-disco .verdict-tier { font-family: 'Monoton', 'Arial Black', sans-serif; font-weight: 400; font-size: 1.55rem; line-height: 1.2; }
        .verdict-christmas .plus, .verdict-disco .plus { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 1.2rem; }

        /* Disco dance floor: six rows receding into the room, front row = tier 1 */
        .disco-floor {
            position: absolute; left: 12px; right: 12px; bottom: 10px; height: 64%;
            display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px;
            transform: perspective(700px) rotateX(24deg); transform-origin: 50% 100%;
        }
        .df-row { display: grid; grid-template-columns: 74px repeat(5, 1fr); gap: 5px; }
        .df-label {
            font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
            color: #5d4f78; display: flex; align-items: center; line-height: 1.1; overflow-wrap: anywhere;
        }
        .df-tile { border-radius: 5px; background: #1a1129; border: 1px solid #2a1d40; transition: background 0.25s, box-shadow 0.25s; }
        .df-row.lit .df-tile { background: var(--c); box-shadow: 0 0 14px var(--c), inset 0 0 10px rgba(255, 255, 255, 0.35); }
        .df-row.lit .df-tile:nth-child(odd) { filter: brightness(0.82); }
        .df-row.lit .df-label { color: var(--c); }
        .df-row.landed .df-tile { animation: df-pulse 0.5s ease-in-out infinite alternate; }
        .df-row.fused .df-tile { animation: df-fuse 1.1s ease-out forwards; }
        @keyframes df-pulse { from { filter: brightness(0.75); } to { filter: brightness(1.35); } }
        @keyframes df-fuse {
            0% { background: #ff3b3b; box-shadow: 0 0 16px #ff3b3b; }
            18% { background: #1a1129; box-shadow: none; }
            32% { background: #ff3b3b; box-shadow: 0 0 12px #ff3b3b; }
            100% { background: #120b1d; box-shadow: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .df-row.landed .df-tile { animation: none; }
            .df-row.fused .df-tile { animation: none; background: #120b1d; }
            .df-tile { transition: none; }
        }

        /* Theme picker on the create screen */
        .field-label { font-weight: 600; }
        .theme-hint { margin-top: 0.2rem; }
        .theme-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
        .theme-option {
            position: relative; display: flex; flex-direction: column; gap: 0.15rem; margin: 0;
            padding: 0.7rem 0.75rem; border: 2px solid var(--line); border-radius: 0.7rem; cursor: pointer; font-weight: 400;
        }
        .theme-option input { position: absolute; opacity: 0; pointer-events: none; }
        .theme-option:has(input:checked) { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
        .theme-option:has(input:focus-visible) { outline: 2px solid var(--green); outline-offset: 2px; }
        .theme-option-name { font-weight: 800; font-size: 1.05rem; }
        .theme-option-christmas .theme-option-name { font-family: 'Mountains of Christmas', Georgia, serif; font-size: 1.3rem; color: #b3261e; }
        .theme-option-disco .theme-option-name { font-family: 'Monoton', 'Arial Black', sans-serif; font-weight: 400; color: #8a3fd1; letter-spacing: 0.04em; }
        .theme-option-blurb { font-size: 0.85rem; color: var(--muted); }
        .theme-option-tiers { font-size: 0.75rem; color: var(--muted); font-style: italic; }
        .theme-switch select { width: 100%; }

        /* Results */
        .my-score { text-align: center; }
        .my-score-total { font-size: 2.6rem; font-weight: 800; color: var(--accent-text); line-height: 1.1; }
        .leaderboard { list-style: none; }
        .results-tabs { margin: 0.5rem 0 0.75rem; }
        .leaderboard li { border-bottom: 1px solid var(--line); }
        .leaderboard li:last-child { border-bottom: none; }
        .leaderboard li.me > .lb-row, .answer-rows li.me { font-weight: 700; }
        .lb-row {
            display: flex; gap: 0.6rem; align-items: center; width: 100%;
            padding: 0.6rem 0.2rem; background: none; border: none;
            font: inherit; color: inherit; text-align: left; cursor: pointer;
        }
        .lb-rank { width: 1.6rem; color: var(--muted); }
        .lb-name { flex: 1; }
        .lb-total { font-variant-numeric: tabular-nums; }
        .lb-chevron { color: var(--muted); width: 1rem; text-align: right; }
        .lb-section { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1rem; }
        .player-answers { list-style: none; margin: 0 0 0.6rem 2.2rem; }
        .player-answers li { padding: 0.4rem 0; border-bottom: 1px dashed var(--line); font-weight: 400; }
        .player-answers li:last-child { border-bottom: none; }
        .pa-prompt { display: block; color: var(--muted); font-size: 0.8rem; }
        .pa-answer { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .pop-count { width: 2rem; flex-shrink: 0; font-weight: 800; color: var(--accent-text); }

        .prompt-label { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .answer-rows { list-style: none; }
        .answer-rows li { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
        .ar-name { width: 30%; flex-shrink: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
        .ar-answer { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .tried { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 400; font-style: italic; }
        .tier-pill {
            flex-shrink: 0; font-size: 0.75rem; font-weight: 700; color: #fff;
            padding: 0.15rem 0.5rem; border-radius: 1rem; white-space: nowrap;
        }
        .tier-0 { background: #b9b4aa; }
        .tier-1 { background: var(--t1); }
        .tier-2 { background: var(--t2); }
        .tier-3 { background: var(--t3); }
        .tier-4 { background: var(--t4); }
        .tier-5 { background: var(--t5); }
        .tier-6 { background: var(--t6); }
        .nobody-label { font-weight: 700; margin-top: 0.8rem; font-size: 0.9rem; }
        .nobody { font-size: 0.9rem; }
        .nobody-points { color: var(--gold); font-weight: 700; font-size: 0.8rem; }
        details { margin-top: 0.7rem; font-size: 0.9rem; }
        summary { cursor: pointer; color: var(--accent-text); font-weight: 600; }

        /* Answer browser — js/answerBrowser.js */
        .answer-browser { margin-top: 0.6rem; }
        .ab-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0.6rem 0 0.3rem; }
        .ab-suggestions { margin-bottom: 0.4rem; }
        .ab-chips { display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.3rem; scrollbar-width: none; }
        .ab-chip {
            flex-shrink: 0; font: inherit; font-size: 0.8rem; font-weight: 600; white-space: nowrap;
            padding: 0.35rem 0.7rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
        }
        .ab-chip.active { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
        .ab-search { margin: 0.4rem 0; }
        .ab-letters { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.25rem; margin-bottom: 0.4rem; }
        .ab-letter {
            font: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.4rem 0;
            border: 1px solid var(--line); border-radius: 0.4rem; background: var(--card); color: var(--ink); cursor: pointer;
        }
        .ab-letter.active { background: var(--green); border-color: var(--green); color: #fff; }
        .ab-letter:disabled { opacity: 0.3; cursor: default; }
        .ab-list { max-height: 22rem; overflow-y: auto; border-top: 1px solid var(--line); }
        .ab-row {
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; width: 100%;
            padding: 0.5rem 0.2rem; border: none; border-bottom: 1px dashed var(--line);
            background: none; font: inherit; font-size: 0.95rem; color: var(--ink); text-align: left;
        }
        button.ab-row { cursor: pointer; }
        button.ab-row:active { background: var(--bg); }
        .ab-list .hint { padding: 0.6rem 0.2rem; }

        /* Review */
        .review-message { background: color-mix(in srgb, var(--green) 16%, var(--card)); border-radius: 0.6rem; padding: 0.6rem 0.8rem; margin-bottom: 0.75rem; font-weight: 600; }
        .review-row { padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
        .review-row:last-child { border-bottom: none; }
        .review-try strong { display: block; font-size: 1.05rem; }
        .review-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
        .review-form { margin-top: 0.4rem; }
        .review-form select { width: 100%; }

        /* Admin */
        .admin-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.4rem; }
        .admin-roles { display: flex; gap: 1.2rem; margin-bottom: 0.6rem; }
        .switch { display: flex; align-items: center; gap: 0.4rem; margin: 0; font-weight: 500; cursor: pointer; }
        .switch input { width: 1.2rem; height: 1.2rem; accent-color: var(--green); }
        .reset-code { background: var(--bg); border-radius: 0.6rem; padding: 0.7rem; }
        .reset-code .code { font-size: 1.3rem; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
        .reset-code .btn { margin-top: 0.5rem; }

        /* Create */
        h3 { font-size: 1.05rem; margin-bottom: 0.5rem; }
        select {
            font: inherit; font-size: 1rem; padding: 0.55rem 0.4rem;
            border: 2px solid var(--line); border-radius: 0.6rem; background: var(--field); color: var(--ink);
        }
        .save-status { font-size: 0.85rem; color: var(--muted); }
        .save-status.error { color: var(--red); }
        .editor-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .editor-title { font-size: 1.4rem; margin: 0.8rem 0; }
        .prompt-slot {
            display: flex; align-items: center; gap: 0.75rem; width: 100%;
            font: inherit; color: inherit; text-align: left; cursor: pointer;
        }
        .slot-num {
            flex-shrink: 0; width: 2rem; height: 2rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; background: var(--line); color: var(--muted);
        }
        .slot-started .slot-num { background: var(--gold); color: #fff; }
        .slot-ready .slot-num { background: var(--green); color: #fff; }
        .slot-body { flex: 1; min-width: 0; }
        .slot-text { display: block; font-weight: 650; }
        .slot-meta { display: block; color: var(--muted); font-size: 0.85rem; }
        .slot-arrow { color: var(--muted); font-size: 1.5rem; }
        .warn { background: color-mix(in srgb, var(--gold) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--card)); border-radius: 0.6rem; padding: 0.7rem 0.8rem; margin: 0.6rem 0; font-size: 0.9rem; }
        .warn ul { margin: 0.3rem 0 0 1.1rem; }
        .advanced summary { margin-bottom: 0.5rem; }
        .advanced textarea { margin-top: 0.5rem; }
